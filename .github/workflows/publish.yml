name: Publish VPN image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/publish.yml
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-vpn
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/zerox80/mavi-vpn

jobs:
  prepare:
    if: github.repository == 'zerox80/mavi-vpn-docker' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Check out current server source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zerox80/mavi-vpn
          ref: main
          persist-credentials: false
      - name: Record source revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: '1.97.0'
      - name: Refresh branch-tracked forks for both architectures
        run: |
          cargo update -p quinn -p quinn-proto -p quinn-udp \
            -p h3 -p h3-quinn -p h3-datagram -p h2
          python3 scripts/check_fork_sources.py --check-remote
      - name: Save shared build lockfile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-lockfile
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 30

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out image definition
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out exact server source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zerox80/mavi-vpn
          ref: ${{ needs.prepare.outputs.source_sha }}
          path: source
          persist-credentials: false
      - name: Use shared build lockfile
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-lockfile
          path: source
      - name: Exclude local state from image context
        run: cp .dockerignore source/.dockerignore
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push architecture by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: source
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          pull: true
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=vpn-${{ matrix.arch }}
          cache-to: type=gha,scope=vpn-${{ matrix.arch }},mode=max
          labels: |
            org.opencontainers.image.title=Mavi VPN Server
            org.opencontainers.image.description=Prebuilt Mavi VPN server for Docker Compose
            org.opencontainers.image.source=https://github.com/zerox80/mavi-vpn-docker
            org.opencontainers.image.url=https://github.com/zerox80/mavi-vpn
            org.opencontainers.image.revision=${{ needs.prepare.outputs.source_sha }}
            org.opencontainers.image.licenses=MIT
            io.mavi-vpn.deployment.revision=${{ github.sha }}
      - name: Export image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - name: Save image digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Load architecture digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish combined image only after both builds succeed
        working-directory: ${{ runner.temp }}/digests
        env:
          BUILD_TAG: build-${{ github.run_id }}-${{ github.run_attempt }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          images=()
          for digest in *; do
            images+=("$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create \
            --tag "$IMAGE:$BUILD_TAG" \
            --tag "$IMAGE:latest" \
            "${images[@]}"
          docker buildx imagetools inspect "$IMAGE:$BUILD_TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "Server source: https://github.com/zerox80/mavi-vpn/commit/$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployment revision: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Rollback image: $IMAGE:$BUILD_TAG" >> "$GITHUB_STEP_SUMMARY"
